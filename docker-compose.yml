version: "3.9"

services:
  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-unext_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [dev, prod]

  # ── App: Development ──────────────────────────────────────────────────────
  app-dev:
    image: maven:3.9-eclipse-temurin-21-alpine
    working_dir: /app
    command: mvn spring-boot:run -Dspring-boot.run.profiles=development
    volumes:
      - .:/app
      - maven_cache:/root/.m2
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    environment:
      DB_HOST: db
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    profiles: [dev]

  # ── App: Production ───────────────────────────────────────────────────────
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    environment:
      DB_HOST: db
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: [prod]

volumes:
  postgres_data:
  maven_cache:
